# Keeps the Supabase project awake (the free plan pauses after ~7 quiet days, which breaks every form)
# and doubles as a daily health check: if the site or database is down, this run fails and GitHub emails you.
# Note: GitHub turns off scheduled workflows after 60 days without any commit; re-enable it in the Actions tab if so.
name: Keep database awake

on:
  schedule:
    - cron: "17 1 * * *" # daily, 01:17 UTC (6:47am Sri Lanka)
  workflow_dispatch: # run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the site's keep-awake endpoint
        run: curl --fail --silent --show-error --retry 3 --retry-delay 20 --max-time 30 https://veyomedia.com/api/keep-awake
